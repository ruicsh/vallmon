name: vallmon

on:
  schedule:
    # 18:00 UTC on weekdays - safely after the London close (year-round).
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update reading
        run: python volmon.py run --ci

      - name: Regenerate README report
        run: python volmon.py report

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/delta_sigma.csv README.md
          if git diff --staged --quiet; then
            echo "No new data - nothing to commit."
          else
            git commit -m "chore: update VALL delta-sigma ($(date -u +%Y-%m-%d))"
            git push
          fi
