name: vallmon

on:
  schedule:
    # 18:00 UTC on weekdays - safely after the London close (year-round).
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the `update` job widens this to commit its reading back.
permissions:
  contents: read

# Serialise runs per ref so two updates can never race on the same commit.
concurrency:
  group: vallmon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: python -m pytest -q

  update:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update reading
        # --strict: never commit an append to a series that no longer reproduces
        # from source. A failure here means "run rebuild", not "ignore".
        run: python vallmon.py run --ci --strict

      - name: Regenerate README report
        run: python vallmon.py report

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/delta_sigma.csv README.md REPORT.md
          if git diff --staged --quiet; then
            echo "No new data - nothing to commit."
          else
            git commit -m "chore: update VALL delta-sigma ($(date -u +%Y-%m-%d))"
            # main may have moved since checkout; replay our commit on top of it.
            git pull --rebase
            git push
          fi
